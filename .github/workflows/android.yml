name: APK piloto
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      # El runner ya trae el SDK de Android (ANDROID_HOME); Gradle descarga
      # la plataforma que falte. setup-android@v3 falla al pedir el paquete
      # 'tools', retirado por Google.
      - name: Comprobar SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Compilar
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: presencia-apk
          path: android/app/build/outputs/apk/release/*.apk
